name: vireo
description: Vireo — fitness and wellness app for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.9.0
  purchases_flutter: ^8.7.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  video_player: ^2.9.5
  health: ^13.2.0
  image_picker: ^1.1.2
  app_settings: ^6.1.1
  google_fonts: ^8.2.1
  freezed_annotation: ^2.4.4
  fl_chart: ^0.70.2
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/vireo_logo.svg
